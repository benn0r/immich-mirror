name: ImmichMirror
options:
  bundleIdPrefix: ch.benn0r
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${IOS_DEVELOPMENT_TEAM}
targets:
  ImmichMirror:
    type: application
    platform: iOS
    sources:
      - path: ImmichMirror
        excludes: ["AppIcon.icon", "AppIcon.icon/**"]
      - path: ImmichMirror/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: ImmichMirror/Support/Info.plist
      properties:
        CFBundleDisplayName: Photo Mirror
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: Photo Mirror reads your photo library to mirror it — including deletions and albums — to your Immich server.
        UIBackgroundModes: [processing, fetch]
        BGTaskSchedulerPermittedIdentifiers: [ch.benn0r.immichmirror.sync, ch.benn0r.immichmirror.continued]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benn0r.immichmirror
        PRODUCT_NAME: ImmichMirror
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  ImmichMirrorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ImmichMirrorTests]
    dependencies:
      - target: ImmichMirror
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ch.benn0r.immichmirror.tests
schemes:
  ImmichMirror:
    build:
      targets:
        ImmichMirror: all
        ImmichMirrorTests: [test]
    test:
      targets: [ImmichMirrorTests]
