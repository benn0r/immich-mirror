name: Native iOS CI
# Tests every branch push and pull request. Tags are left to release.yml, which builds the
# installable IPA (the CI build is unsigned).
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: .build/DerivedData/Build/Products/Release-iphoneos/ImmichMirror.app
          if-no-files-found: error

  test:
    needs: build
    runs-on: macos
    steps:
      - uses: actions/checkout@v4
      - run: command -v xcodegen || brew install xcodegen
      - run: npm run test:unit
